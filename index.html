<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="錶哥網是個充滿活力的網站，既美觀又漂亮。">
  <title>首頁|biaogeNet</title>
  <link rel="icon" href="https://biaogenet.qzz.io/images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://biaogenet.qzz.io/styles/green.css">
  <style>
     .yt {
  border: none;
  cursor: pointer;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background-image: url('https://biaogenet.qzz.io/images/youtube.png');
  background-size: cover;
  background-position: center;
}

.dc {
  border: none;
  cursor: pointer;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background-image: url('https://biaogenet.qzz.io/images/discord.png');
  background-size: cover;
  background-position: center;
}

.tk {
  border: none;
  cursor: pointer;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background-image: url('https://biaogenet.qzz.io/images/tiktok.png');
  background-size: cover;
  background-position: center;
}

.bigtxt {
  font-size: 60px;
}

#tips {
  color: #676700;
  animation: tipsPulse 2s ease-in-out infinite;
}

@keyframes tipsPulse {
  0%, 100% {
    color: #676700;
    transform: scale(1);
  }
  50% {
    color: #878700;
    transform: scale(0.98);
  }
}

.minicard {
  position: relative;
  width: 380px;
  height: 380px;
  box-sizing: border-box;
  margin: 8px;
  padding: 20px;

  display: inline-flex;
  vertical-align: top;
  align-items: center;
  justify-content: center;
  flex-direction: column;

  color: #000;
  text-align: center;

  background: rgba(192, 224, 184, 0.80);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 20px;
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.14),
    inset 1px 1px 2px rgba(255, 255, 255, 0.20);

  overflow: hidden;
}

#randomCards {
  text-align: center;
  opacity: 1;
  transition: opacity 0.25s ease;
}

#randomCards.fading {
  opacity: 0;
}

#changeCards {
  margin: 12px;
  cursor: pointer;
}
  </style>
</head>
<body>
  <div class="container">
    <button class="menu-btn" id="menuButton" type="button"
  onclick="OpenMenu()"
  aria-expanded="false">☰</button>
    <img class="topimg" src="https://biaogenet.qzz.io/images/favicon.png" alt="錶哥網小圖示" />
    <h3 class="title">錶哥網|biaogeNet</h3>
  </div>

  <div id="sideMenu" class="side-menu">
    <a href="https://biaogenet.qzz.io/index.html">錶哥網首頁</a>
    <a href="https://biaogenet.qzz.io/tools/coin.html">投硬幣</a>
    <a href="https://biaogenet.qzz.io/other/pp.html">隱私權政策</a>
  </div>

  <div class="content">
    <h1 id="conttitle">熊~你好！歡迎來到錶哥網</h1>
    <p>✨ 錶哥網首頁大翻新！介紹錶哥熊現已移至 <a href="https://biaogenet.qzz.io/about.html">關於→</a></p>
    <p id="tips">熊~冷知識載入中……</p>

    <h2>建議功能</h2>
    <button id="changeCards" type="button">換一批</button>
    <a href="https://biaogenet.qzz.io/morefun.html">更多功能...</a>
    <div id="randomCards" aria-live="polite"></div>
    <h3></h3>
  </div>

  <script>
    // 側邊選單
    function OpenMenu() {
      document.getElementById("sideMenu").classList.toggle("open");
    }

    // 載入網站選單；失敗時保留 HTML 內建連結
    const sideMenu = document.getElementById("sideMenu");
    fetch("https://biaogenet.qzz.io/menu.json")
      .then(response => {
        if (!response.ok) throw new Error("選單載入失敗");
        return response.json();
      })
      .then(menu => {
        sideMenu.replaceChildren();
        for (const [name, url] of Object.entries(menu)) {
          const link = document.createElement("a");
          link.href = url;
          link.textContent = name;
          sideMenu.appendChild(link);
        }
      })
      .catch(error => console.error("選單載入失敗，使用內建選單：", error));

    // 依照時間更新歡迎文字
    function updateTitle() {
      const hour = new Date().getHours();
      let greeting;
      if (hour >= 5 && hour < 12) greeting = "早安";
      else if (hour >= 12 && hour < 18) greeting = "午安";
      else greeting = "晚安";

      const heading = document.getElementById("conttitle");
      if (heading) heading.textContent = `熊~${greeting}！歡迎來到錶哥網`;
    }
    updateTitle();

    // 隨機冷知識
    const facts = [
      "早期錶哥網圖標與現在的不同。",
      "錶哥熊其實早在2021年就存在了。",
      "錶哥熊的英文是Biaoge Bear。",
      "錶哥網早期竟然沒有液態玻璃效果！",
      "應用商店其實被錶哥熊默默移除了。",
      "素材下載？多數錶哥網用戶都不知道。",
      "錶哥熊討厭蔥。",
      "錶哥網簡稱BN，倒過來就是NB，所以錶哥網很牛逼！"
    ];
    const tips = document.getElementById("tips");
    if (tips) tips.textContent = "冷知識：" + facts[Math.floor(Math.random() * facts.length)];

    // 首頁隨機卡片
    const cardList = [
      {
        icon: "ⓘ",
        title: "關於",
        description: "認識錶哥熊，以及錶哥網的故事。",
        url: "https://biaogenet.qzz.io/about.html"
      },
      {
        icon: "📝",
        title: "幸運刮刮樂",
        description: "試試手氣，還可以用來決定今天吃什麼！",
        url: "https://biaogenet.qzz.io/tools/scratcher.html"
      },
      {
        icon: "🎂",
        title: "生日",
        description: "查看錶哥熊的生日倒數。",
        url: "https://biaogenet.qzz.io/birthday.html"
      },
      {
        icon: "🔒",
        title: "隱私權政策",
        description: "了解錶哥網的隱私權政策。",
        url: "https://biaogenet.qzz.io/pp.html"
      },
      {
        icon: "🪙",
        title: "投硬幣",
        description: "讓硬幣幫你做出隨機選擇。",
        url: "https://biaogenet.qzz.io/tools/coin.html"
      },
      {
        icon: "▶️",
        title: "Youtube",
        description: "錶哥熊動畫官方Youtube頻道。",
        url: "https://youtube.com/@biaogeYT"
      },
      {
        icon: "💬",
        title: "Discord",
        description: "錶哥綜合台Discord群組。",
        url: "https://discord.gg/ppVer9cqCe"
      },
      {
        icon: "♪",
        title: "抖音",
        description: "錶哥熊的抖音頻道。",
        url: "https://www.tiktok.com/@biaogetk"
      },
      {
        icon: "?",
        title: "神秘影片",
        description: "神秘的Youtube小影片😈",
        url: "https://youtu.be/dQw4w9WgXcQ"
      }
    ];

    const cardsContainer = document.getElementById("randomCards");
    const changeButton = document.getElementById("changeCards");
    let previousCards = [];
    let isChangingCards = false;

    function renderRandomCards() {
      if (!cardsContainer || cardList.length === 0) return;

      const count = Math.min(2, cardList.length);
      let available = cardList.filter(card => !previousCards.includes(card.title));
      if (available.length < count) available = [...cardList];

      // Fisher-Yates 洗牌
      for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
      }

      const selected = available.slice(0, count);
      previousCards = selected.map(card => card.title);
      cardsContainer.replaceChildren();

      selected.forEach(card => {
        const element = document.createElement("div");
        element.className = "minicard";

        const icon = document.createElement("h1");
        icon.className = "bigtxt";
        icon.textContent = card.icon;

        const title = document.createElement("h2");
        title.textContent = card.title;

        const description = document.createElement("p");
        description.textContent = card.description;

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "進入";
        button.addEventListener("click", () => {
          window.location.href = card.url;
        });

        element.append(icon, title, description, button);
        cardsContainer.appendChild(element);
      });
    }

    // 點擊換一批：淡出、更新卡片、淡入
    changeButton.addEventListener("click", () => {
      if (isChangingCards) return;
      isChangingCards = true;
      cardsContainer.classList.add("fading");

      window.setTimeout(() => {
        renderRandomCards();
        // 強制瀏覽器先套用淡出狀態，再移除 class 觸發淡入
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            cardsContainer.classList.remove("fading");
            isChangingCards = false;
          });
        });
      }, 250);
    });

    // 初次載入直接顯示第一批，不播放淡出動畫
    renderRandomCards();
  </script>
</body>
</html>
