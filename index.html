<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="錶哥網是個充滿活力的網站，既美觀又漂亮。">
  <title>首頁|biaogeNet</title>
  <link rel="icon" href="https://biaogenet.qzz.io/images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://biaogenet.qzz.io/styles/green.css">
  <style>
.bigtxt {
  font-size: 60px;
}

.tips {
  color: #676700;
  animation: tipsPulse 2s ease-in-out infinite;
}

@keyframes tipsPulse {
  0%, 100% {
    color: #676700;
    transform: scale(1);
  }
  50% {
    color: #878700;
    transform: scale(0.98);
  }
}

.minicard {
  position: relative;
  width: 380px;
  height: 380px;
  box-sizing: border-box;
  margin: 8px;
  padding: 20px;
  display: inline-flex;
  vertical-align: top;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #000;
  text-align: center;
  background: rgba(192, 224, 184, 0.80);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 20px;
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.14),
    inset 1px 1px 2px rgba(255, 255, 255, 0.20);

  overflow: hidden;
}


.quick {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  width: min(100%, 620px);
  margin: 20px auto;
}

.quick a {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 120px;
  padding: 18px 10px;
  color: #000;
  text-decoration: none;
  text-align: center;
  font-size: 20px;
  line-height: 1.5;
  background: rgba(192, 224, 184, 0.80);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 20px;
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.14),
    inset 1px 1px 2px rgba(255, 255, 255, 0.20);
  transition:
    background-color 0.2s ease,
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    transform 0.2s ease;
}

.quick a::first-line {
  font-size: 28px;
}

@media (max-width: 600px) {
  .quick {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: min(100%, 620px);
    margin: 16px auto;
  }

  .quick a {
    min-height: 105px;
    padding: 14px 8px;
    gap: 7px;
    font-size: 16px;
    line-height: 1.4;
  }

  .quick a::first-line {
    font-size: 23px;
  }
}

@media (max-width: 360px) {
  .quick {
    gap: 8px;
  }

  .quick a {
    min-height: 92px;
    padding: 12px 5px;
    font-size: 14px;
  }

  .quick a::first-line {
    font-size: 21px;
  }
}

.quick a:active {
  background: rgba(172, 204, 164, 0.95);
  transform: scale(0.93);
}

@media (hover: hover) and (pointer: fine) {
  .quick a:hover {
    background: rgba(182, 214, 174, 0.95);
    transform: scale(1.03);
  }
}

.easterContent {
  margin-top: 96px;
  text-align: center;
}

.container.drop {
   position: fixed;
   z-index: 20;
   animation: containerDrop 0.75s cubic-bezier(.34, 1.56, .64, 1) forwards;
}

@keyframes containerDrop {
    0% { transform: translateY(0); }
    72% { transform: translateY(calc(100vh - 100% - 12px)); }
    86% { transform: translateY(calc(100vh - 100% - 24px)); }
    100% { transform: translateY(calc(100vh - 100% - 12px)); }
}

.side-menu.drop {
   position: fixed;
   z-index: 19;
   animation: SideMenuDrop 0.75s cubic-bezier(.34, 1.56, .64, 1) forwards;
}

@keyframes SideMenuDrop {
    0% { transform: translateY(0); }
    72% { transform: translateY(calc(100vh - 100% - 12px)); }
    86% { transform: translateY(calc(100vh - 100% - 24px)); }
    100% { transform: translateY(calc(100vh - 100% - 12px)); }
}

.date-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

.date-row #homeDate {
  margin: 0;
}

.activity {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 30px;
  width: 30px;
  min-width: 30px;
  height: 30px;
  box-sizing: border-box;
  color: #fff;
  background: #777;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.28);
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
  user-select: none;
  transition: background-color 0.2s ease, transform 0.2s ease;
}
  </style>
</head>
<body>
  <div class="container" id="container">
    <button class="menu-btn" id="menuButton" type="button"
  onclick="OpenMenu()"
  aria-expanded="false">☰</button>
    <img class="topimg" src="https://biaogenet.qzz.io/images/favicon.png" alt="錶哥網小圖示" />
    <h3 class="title">錶哥網|biaogeNet</h3>
  </div>

  <div id="sideMenu" class="side-menu">
    <a href="https://biaogenet.qzz.io/index.html">錶哥網首頁</a>
    <a href="https://biaogenet.qzz.io/tools/coin.html">投硬幣</a>
    <a href="https://biaogenet.qzz.io/other/pp.html">隱私權政策</a>
  </div>

  <div class="content">
    <h1 id="heading" ondblclick="EasterEgg()">熊~你好！歡迎來到錶哥網</h1>
    <p id="engheading">Hello,Welocme to biaogeNet</p>
    <p id="tips" onclick="RndTips()" class="tips">熊~冷知識載入中……</p>
    <h2>⏰ 現在時間</h2>
    <div class="crad">
      <h3 id="homeClock">熊~時間載入中……</h3>
      <div class="date-row">
        <span class="activity" id="todayActivity" title="今日沒有特殊活動" onclick="OpenActivity()">無</span>
        <p id="homeDate" ondblclick="AprilFool()">熊~日期載入中……</p>
      </div>
     </div>
    <h2>🚀 快捷入口</h2>
    <p>「快捷入口」既方便又快速。</p>
    <div class="quick">
      <a href="https://biaogenet.qzz.io/about.html">ⓘ<br>關於</a>
      <a href="https://biaogenet.qzz.io/tools/coin.html">🪙<br>投硬幣</a>
      <a href="https://biaogenet.qzz.io/tools/scratcher.html">📝<br>刮刮樂</a>
    </div>
    <h2>🏷️ 隨機熊名</h2>
    <p id="RndNameResult">熊~熊名載入中……</p>
    <button onclick="RndBearName()">換一個</button>
    <h3></h3>
  </div>
  <div class="easterContent">
    <h1>熊~恭喜你發現了！</h1>
    <p>你找到了一個平常不會出現的地方</p>
    <p id="hiddenTips" onclick="RndHiddenTips()" class="tips">熊~隱藏知識載入中……</p>
    <h2>🧭 探索此陌生之地</h2>
    <div class="quick">
      <a href="https://web.archive.org/web/https://biaogenet.qzz.io/imagedow.html">⬇️<br>舊素材下載</a>
      <a onclick="MenuDrop()" id="menuDropBtn">🔨<br>選單掉落</a>
      <a onclick="EasterBack()">↩️<br>返回</a>
    </div>
    <h2>🥚 已知彩蛋</h2>
    <div class="crad">
      <h2 id="knowEggTitle">進入本頁</h2>
      <p id="knowEggText">雙擊首頁的大標題</p>
      <p id="knowEggCount">1/3</p>
      <button onclick="PreKnowEgg()">←</button>
      <button onclick="NextKnowEgg()">→</button>
    </div>
  <h3></h3>
  </div>
  <script>
    function OpenMenu() {
      const menu = document.getElementById("sideMenu");
      const button = document.getElementById("menuButton");
      const isOpen = menu.classList.toggle("open");
      if (button) button.setAttribute("aria-expanded", String(isOpen));
    }

    const sideMenu = document.getElementById("sideMenu");
    fetch("https://biaogenet.qzz.io/menu.json")
      .then(response => {
        if (!response.ok) throw new Error("選單載入失敗");
        return response.json();
      })
      .then(menu => {
        sideMenu.replaceChildren();
        for (const [name, url] of Object.entries(menu)) {
          const link = document.createElement("a");
          link.href = url;
          link.textContent = name;
          sideMenu.appendChild(link);
        }
      })
      .catch(error => console.error("選單載入失敗，使用內建選單：", error));

    const DropSound = new Audio("https://biaogenet.qzz.io/sounds/drop.mp3");
    
    function updateTitle() {
      const hour = new Date().getHours();
      let greeting;
      if (hour >= 5 && hour < 12) greeting = "早安";
      else if (hour >= 12 && hour < 18) greeting = "午安";
      else greeting = "晚安";

      const heading = document.getElementById("heading");
      if (heading) heading.textContent = `熊~${greeting}！歡迎來到錶哥網`;
      document.querySelector(".easterContent").style.display = "none";
      DropSound.preload = "auto";
      DropSound.load();
    }
    updateTitle();
    
    function updateEngTitle() {
      const hour = new Date().getHours();
      let greeting;
      if (hour >= 5 && hour < 12) greeting = "Good morning";
      else if (hour >= 12 && hour < 18) greeting = "Good afternoon";
      else greeting = "Good night";

      const heading = document.getElementById("engheading");
      if (heading) heading.textContent = `${greeting},Welocme to biaogeNet`;
    }
    updateEngTitle();
    
    function EasterEgg() {
      document.querySelector(".content").style.display = "none";
      document.querySelector(".easterContent").style.display = "block";
    }
    
    function EasterBack() {
      document.querySelector(".easterContent").style.display = "none";
      document.querySelector(".content").style.display = "block";
    }

    const facts = [
      "早期錶哥網圖標與現在的不同。",
      "錶哥熊的英文是Biaoge Bear。",
      "錶哥網早期竟然沒有液態玻璃效果！",
      "應用商店其實被錶哥熊默默移除了。",
      "素材下載？多數錶哥網用戶都不知道。",
      "錶哥熊討厭蔥。",
      "錶哥網簡稱BN，倒過來就是NB，所以錶哥網很牛逼！",
      "熊愛吃蜂蜜，錶哥熊也是如此。",
      "點我一下可以換一個冷知識。",
      "隨便的亂點，會有驚喜(應該吧)"
    ];
    
    const hiddentips = [
      "早期，錶哥熊有一隻他非常喜歡的手錶，錶哥熊就這麼誕生了。",
      "錶哥熊其實早在2021年就存在了。",
      "錶哥熊的某些帳號其實是用學校Mail註冊的。",
      "可以在網路檔案館中找到舊的錶哥網。",
      "點進舊版素材下載，就能找到舊版錶哥網啦！",
      "錶哥在高熊=錶哥熊在高雄。"
    ];
    
    const EasterEggs = [
      {
        "title": "進入本頁",
        "text": "雙擊首頁的大標題"
      },
      {
        "title": "生日入口",
        "text": "雙擊關於頁中的「生日」即可打開錶哥熊解凍倒數"
      },
      {
        "title": "愚人彩蛋",
        "text": "在愚人節當天雙擊時鐘，網頁中的文字會集體熊化"
      },
      {
        "title": "錶網藍屏",
        "text": "在404中雙擊錶哥熊，畫面會變成早期藍屏風格"
      }
    ];
    
      const todayActivities = [
        {
          "id": "bgbirthday",
          "month": 11,
          "day": 14,
          "icon": "錶",
          "color": "#22b14c",
          "title": "今天是錶哥熊生日！"
        },
        {
          "id": "aprilfool",
          "month": 4,
          "day": 1,
          "icon": "愚",
          "color": "#e6a12a",
          "title": "愚人節彩蛋：雙擊日期試試看"
        }
      ];

    function RndTips() {
      const tips = document.getElementById("tips");
      if (tips) tips.textContent = "冷知識：" + facts[Math.floor(Math.random() * facts.length)];
    }
    
    RndTips();
    
    function RndHiddenTips() {
      const tips = document.getElementById("hiddenTips");
      if (tips) tips.textContent = "隱藏知識：" + hiddentips[Math.floor(Math.random() * hiddentips.length)];
    }
    
    RndHiddenTips();
 
    function updateClock() {
      const now = new Date();
      const homeClock = document.getElementById("homeClock");
      if (!homeClock) return;

      homeClock.textContent = now.toLocaleTimeString("zh-TW", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
    }

    updateClock();
    setInterval(updateClock, 1000);

    function updateDate() {
      const now = new Date();
      const homeDate = document.getElementById("homeDate");
      const todayActivity = document.getElementById("todayActivity");
      if (!homeDate || !todayActivity) return;

      const dateText = now.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      });

      const activity = todayActivities.find(item =>
       item.month === now.getMonth() + 1 &&
       item.day === now.getDate()
     );

      todayActivity.textContent = activity ? activity.icon : "無";
      todayActivity.style.backgroundColor = activity ? activity.color : "#777";
      todayActivity.title = activity ? activity.title : "今日沒有特殊活動";
      todayActivity.dataset.activityId = activity ? activity.id : "none";

      homeDate.textContent = dateText;
    }

    updateDate();

    function OpenActivity() {
      const now = new Date();
      const activity = todayActivities.find(item =>
        item.month === now.getMonth() + 1 &&
        item.day === now.getDate()
      );
      if (!activity) {
        alert("熊~今日沒有特殊活動！");
        return;
      }
      alert(`熊~今日活動資訊
━━━━━━━━━━
活動ID：${activity.id}
活動說明：${activity.title}
活動日期：${activity.month} 月 ${activity.day} 日`);
    }
    
    function RndBearName() {
      const colors = ["紅", "橙", "黃", "綠", "藍", "紫", "粉", "白", "黑", "灰", "棕", "青", "金", "銀"];
      const shapes = ["星", "心", "圓", "方", "扁", "長"];
      const first = colors[Math.floor(Math.random() * colors.length)];
      const secondWords = [...colors, ...shapes]
        .filter(word => word !== first);
      const second = secondWords[Math.floor(Math.random() * secondWords.length)];
    
      document.getElementById("RndNameResult").textContent = "你的專屬熊名：" + first + second + "熊";
    }

    RndBearName();
        
    let KnowEggCountVar = 0;

    function UpdateKnowEgg() {
      const title = document.getElementById("knowEggTitle");
      const text = document.getElementById("knowEggText");
      const count = document.getElementById("knowEggCount");
      if (!title || !text || !count || EasterEggs.length === 0) return;

      const egg = EasterEggs[KnowEggCountVar];
      title.textContent = egg.title;
      text.textContent = egg.text;
      count.textContent = (KnowEggCountVar + 1) + "/" + EasterEggs.length;
    }

    function PreKnowEgg() {
      KnowEggCountVar =
        (KnowEggCountVar - 1 + EasterEggs.length) % EasterEggs.length;
      UpdateKnowEgg();
    }

    function NextKnowEgg() {
      KnowEggCountVar = (KnowEggCountVar + 1) % EasterEggs.length;
      UpdateKnowEgg();
    }

    UpdateKnowEgg();

    function MenuDrop() {
      const container = document.getElementById("container");
      const menu = document.getElementById("sideMenu");
      const button = document.getElementById("menuDropBtn");
    
      if (!container || !menu || !button) return;
    
      void container.offsetWidth;
      void menu.offsetWidth;
    
      container.classList.toggle("drop");
      menu.classList.toggle("drop");
    
      const isDropped =
        container.classList.contains("drop") &&
        menu.classList.contains("drop");
    
      if (isDropped) {
        button.innerHTML = "⬆️<br>選單返回";
    
        DropSound.currentTime = 0;
        DropSound.play().catch(error => {
          console.warn("掉落音效無法播放：", error);
        });
      } else {
        button.innerHTML = "🔨<br>選單掉落";
      }
    }
    
    function AprilFool() {
      const now = new Date();
      const isAprilFool = now.getMonth() === 3 && now.getDate() === 1;
      if (isAprilFool === true) AprilFoolsBear();
    }
    
    
    function AprilFoolsBear() {
      const selectors = "p, a, h1, h2, h3, button";

      document.querySelectorAll(selectors).forEach(element => {
        if (!element.dataset.bearOriginal) {
          element.dataset.bearOriginal = element.innerHTML;
        }

        function transform(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            node.textContent = Array.from(node.textContent).map(char => {
              // 保留空格、標點符號及 Emoji
              if (
                /\s/u.test(char) ||
                /[\p{P}\p{S}]/u.test(char)
              ) {
                return char;
              }

              return "熊";
            }).join("");
          } else {
            node.childNodes.forEach(transform);
          }
        }

        transform(element);
      });
    }

    function AprilFoolsBearRestore() {
      document.querySelectorAll(
        "p, a, h1, h2, h3, button"
      ).forEach(element => {
        if (element.dataset.bearOriginal) {
          element.innerHTML = element.dataset.bearOriginal;
          delete element.dataset.bearOriginal;
        }
      });
    }
  </script>
</body>
</html>
