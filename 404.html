<head>

  <title>錯誤|biaogeNet</title>
  <link rel="icon" href="https://biaogenet.qzz.io/images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://biaogenet.qzz.io/styles/green.css">
</head>
<body>
<div class="container">
  <div class="menu-btn" onclick="OpenMenu()">☰</div>
  <img class="topimg" src="https://biaogenet.qzz.io/images/favicon.png" alt="錶哥網小圖示"/>
  <h3 class="title">錶哥網|biaogeNet</h3>
</div>
<div id="sideMenu" class="side-menu">
  <a href="https://biaogenet.qzz.io">錶哥網首頁</a>
  <a href="https://biaogenet.qzz.io/imagedow.html">素材下載</a>
  <a href="https://biaogenet.qzz.io/appstore.html">應用程式商店</a>
  <a href="https://biaogenet.qzz.io/coin.html">投硬幣</a>
  <a href="https://biaogenet.qzz.io/pp.html">隱私權政策</a>
 </div>
<div class="content">
  <img src="https://biaogenet.qzz.io/images/404error.png" class="bigimg" alt="錯誤圖片">
  <h2>發生錯誤</h2>
  <p>你要找的東西不存在。</p>
  <button onclick="BackHome()">回首頁</button>
</div>
</body>
      <script>
        function OpenMenu() {
            document.getElementById("sideMenu").classList.toggle("open");
        }
        function BackHome() {
            window.location.href = "https://biaogenet.qzz.io";
        }
    </script>
    <script>
const sideMenu = document.getElementById("sideMenu");

fetch("https://biaogenet.qzz.io/menu.json")
  .then(r => r.json())
  .then(menu => {
    sideMenu.innerHTML = "";
    for (const [name, url] of Object.entries(menu)) {
      const a = document.createElement("a");
      a.href = url;
      a.textContent = name;
      sideMenu.appendChild(a);
    }
  })
  .catch(err => {
    sideMenu.innerHTML = "<a>選單載入失敗</a>";
    console.error(err);
  });
    </script>
</html>
