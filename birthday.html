<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="錶哥熊生日小彩蛋">
  <title>生日|biaogeNet</title>
  <link rel="icon" href="https://biaogenet.qzz.io/images/favicon.png" type="image/png" />
    <style>
    body {
      background: #f2fff2;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      font-weight: bold;
    }
    button {
      background: #22b14c;
      height: 50px;
      width: 150px;
      color: #ffffff;
      font-size: 24px;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    button:hover {
      background: #000000;
      color: #ffff
    }
    .container {
      background: #22b14cb1;
      backdrop-filter: blur(10px);
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
    }
    .title {
      color: #ffffff;
      text-align: left;
    }
    .content {
      margin-top: 120px;
      text-align: center;
    }
    .topimg {
      height: 60px;
      width: 60px;
      object-fit: contain;
      margin-right: 8px;
    }
    .bigimg {
      height: 256px;
      width: 256px;
    }
    .white {
      color :#ffffff 
    }
    .menu-btn {
      position: absolute;
      left: 12px;
      font-size: 28px;
      color: #fff;
      cursor: pointer;
    }

    .side-menu {
       position: fixed;
       top: 60px;
       left: -220px;
       width: 200px;
       height: 100%;
       background: #22b14cb1;
       backdrop-filter: blur(10px);
       padding: 16px;
       transition: left 0.3s ease;
       z-index: 999;
    }

    .side-menu a {
      display: block;
      color: white;
      text-decoration: none;
      font-size: 20px;
      margin: 12px 0;
    }

    .side-menu a:hover {
      text-decoration: underline;
    }

    .side-menu.open {
      left: 0;
    }
    
   .box {
      position:relative;
      width:280px;
      height:280px;
      margin:20px auto
   }
   
   .box img {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain
   }
   
   #ice {
      transition:.5s
   }
   
   .progress {
      width:90%;
      max-width:420px;
      height:24px;
      background:#ddd;
      border-radius:99px;
      overflow:hidden;
      margin:auto
   }
   
   .bar {
      height:100%;
      background: linear-gradient(90deg, #22b14c, #22b1c2);
      width:0
   }
   </style>
</head>
<body>
<div class="container">
  <div class="menu-btn" onclick="OpenMenu()">☰</div>
  <img class="topimg" src="https://biaogenet.qzz.io/images/favicon.png" alt="錶哥網小圖示"/>
  <h3 class="title">錶哥網|biaogeNet</h3>
</div>
<div id="sideMenu" class="side-menu">
  <a href="https://biaogenet.qzz.io">錶哥網首頁</a>
  <a href="https://biaogenet.qzz.io/imagedow.html">素材下載</a>
  <a href="https://biaogenet.qzz.io/appstore.html">應用程式商店</a>
  <a href="https://biaogenet.qzz.io/coin.html">投硬幣</a>
  <a href="https://biaogenet.qzz.io/pp.html">隱私權政策</a>
 </div>
<div class="content">
<h1>錶哥熊解凍倒數</h1>
  <div class="box">
    <img src="https://biaogenet.qzz.io/images/birthday_bgx.png" alt="錶哥熊">
    <img id="ice" src="https://biaogenet.qzz.io/images/birthday_ice.png" alt="冰塊">
  </div>
  <h2 id="percent"></h2>
  <h3 id="day"></h3>
    <div class="progress">
      <div class="bar" id="bar">
      </div>
    </div>
</div>
<script>
const sideMenu = document.getElementById("sideMenu");

function OpenMenu() {
  sideMenu.classList.toggle("open");
}

fetch("https://biaogenet.qzz.io/menu.json")
  .then(r => r.json())
  .then(menu => {
    sideMenu.innerHTML = "";
    for (const [name, url] of Object.entries(menu)) {
      const a = document.createElement("a");
      a.href = url;
      a.textContent = name;
      sideMenu.appendChild(a);
    }
  })
  .catch(err => {
    sideMenu.innerHTML = "<a>選單載入失敗</a>";
    console.error(err);
  });
let n=new Date(),y=n.getFullYear(),b=new Date(y,10,14);if(n>b)b=new Date(y+1,10,14);let s=new Date(b.getFullYear()-1,10,14),p=Math.min(Math.max((n-s)/(b-s),0),1);percent.textContent="已解凍 "+(p*100).toFixed(1)+"%";bar.style.width=(p*100)+"%";ice.style.clipPath=`inset(${p*100}% 0 0 0)`;day.textContent=((d)=>d>0?`還有 ${d} 天解凍完成 `:"錶哥熊生日快樂！")(Math.ceil((b-n)/86400000));</script>
</html>
