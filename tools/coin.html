<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="趣味小工具，可愛又實用">
  <title>硬幣|biaogeNet</title>
  <link rel="icon" href="https://biaogenet.qzz.io/images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://biaogenet.qzz.io/styles/green.css">
  <style>
    #coin {
width: 150px;
  cursor: pointer;
  transition: transform 0.3s;
}

#coin:active {
transform: scale(1.1) rotate(20deg);
}
  </style>
</head>
<body>
<div class="container">
  <div class="menu-btn" onclick="OpenMenu()">☰</div>
  <img class="topimg" src="https://biaogenet.qzz.io/images/favicon.png" alt="錶哥網小圖示"/>
  <h3 class="title">錶哥網|biaogeNet</h3>
</div>
<div id="sideMenu" class="side-menu">
  <a href="https://biaogenet.qzz.io">錶哥網首頁</a>
  <a href="https://biaogenet.qzz.io/imagedow.html">素材下載</a>
  <a href="https://biaogenet.qzz.io/appstore.html">應用程式商店</a>
  <a href="https://biaogenet.qzz.io/coin.html">投硬幣</a>
  <a href="https://biaogenet.qzz.io/pp.html">隱私權政策</a>
 </div>
<div class="content">
<h1>投硬幣</h1>
<p id="result">按一下硬幣轉動硬幣</p>
<img id="coin" src="https://biaogenet.qzz.io/images/coin_true.png" alt="硬幣">
</div>
</body>
      <script>
  const coin = document.getElementById('coin');
  const result = document.getElementById('result');
  
  coin.addEventListener('click', () => {
    // 播放動畫
    coin.src = 'https://biaogenet.qzz.io/images/coin.gif';
    result.textContent = '投擲中...';

    // 3秒後顯示結果
    setTimeout(() => {
      const isHeads = Math.random() < 0.5; // 50%機率
      if(isHeads){
        coin.src = 'https://biaogenet.qzz.io/images/coin_true.png';
        result.textContent = '正面';
      } else {
        coin.src = 'https://biaogenet.qzz.io/images/coin_flase.png';
        result.textContent = '反面';
      }
    }, 2000);
  });
        function OpenMenu() {
            document.getElementById("sideMenu").classList.toggle("open");
        }
    </script>
    <script>
const sideMenu = document.getElementById("sideMenu");

fetch("https://biaogenet.qzz.io/menu.json")
  .then(r => r.json())
  .then(menu => {
    sideMenu.innerHTML = "";
    for (const [name, url] of Object.entries(menu)) {
      const a = document.createElement("a");
      a.href = url;
      a.textContent = name;
      sideMenu.appendChild(a);
    }
  })
  .catch(err => {
    sideMenu.innerHTML = "<a>選單載入失敗</a>";
    console.error(err);
  });
    </script>
</html>
