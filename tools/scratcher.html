<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="錶哥熊工具-刮刮樂">
  <title>刮刮樂|biaogeNet</title>
  <link rel="icon" href="https://biaogenet.qzz.io/images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://biaogenet.qzz.io/styles/green.css">
  <style>
    .scratch-settings {
      padding: 15px;
      margin-bottom: 20px;
    }

    .scratch-settings textarea {
      width: 100%;
      min-height: 140px;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      resize: vertical;
    }

    .scratch-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .scratch-buttons button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .scratch-hint {
      opacity: 0.7;
    }

    #scratchStatus {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
      min-height: 24px;
    }

    #scratchCards {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      margin-top: 20px;
      padding:
        0 20px 20px;
      box-sizing: border-box;
    }

    .scratch-card {
      position: relative;
      height: 190px;
      border-radius: 18px;
      overflow: hidden;
      background: white;
    }

    .scratch-result {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      font-weight: bold;
      background-color: #c0e0b8;
      font-size: 24px;
    }

    .scratch-cover {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: crosshair;
      -webkit-user-select: none;
      user-select: none;
    }

    .scratch-cover canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .scratch-number {
      position: absolute;
      top: 9px;
      left: 10px;
      background:
        rgba(255,255,255,0.55);
      padding: 4px 9px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 2;
    }

    .scratch-card.revealed .scratch-cover {
      font-size: 24px;
      display: none;
    }
    /* =========================
       選單永遠在最上層
    ========================= */

    #sideMenu {
      position: fixed;
      z-index: 99999 !important;
    }

    .content {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="menu-btn" onclick="OpenMenu()">☰</div>
  <img class="topimg" src="https://biaogenet.qzz.io/images/favicon.png" alt="錶哥網小圖示"/>
  <h3 class="title">錶哥網|biaogeNet</h3>
</div>
<div id="sideMenu" class="side-menu">
  <a href="https://biaogenet.qzz.io">錶哥網首頁</a>
</div>
<div class="content">
  <h1>幸運刮刮樂</h1>
  <p>每行輸入一個獎項，開始遊戲後會自動隨機打亂順序。</p>
  <div class="scratch-settings">
  <textarea id="scratchItems">錶哥熊
綠熊
風格熊</textarea>
    <label for="scratchPreset">請選擇刮刮樂模板</label>
    <select id="scratchPreset" onchange="loadScratchPreset()"
      style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0 12px;border:1px solid #ccc;border-radius:12px;background:white;">
      <option value="family">🐻三熊一家</option>
      <option value="bomb">💣炸彈與熊</option>
      <option value="truefalse">✅是真是假</option>
      <option value="dice">🎲錶骰骰子</option>
      <option value="food">🍚今日食物</option>
      <option value="drink">🧋飯後飲品</option>
      <option value="custom">✏️自訂</option>
    </select>
    <div class="scratch-buttons">
      <button onclick="startScratch()">打亂</button>
      <button onclick="clearScratch()">清空</button>
      <button onclick="revealAllScratch()">全部揭曉</button>
    </div>
  </div>
  <div id="scratchStatus"></div>
  <div id="scratchCards"></div>
</div>
<script>
/* =========================
   biaogeNet 選單
========================= */

const sideMenu =
  document.getElementById("sideMenu");
function OpenMenu() {

  sideMenu.classList.toggle("open");

}
/* =========================
   從 menu.json 載入選單
========================= */

fetch(
  "https://biaogenet.qzz.io/menu.json"
)

  .then(r => r.json())

  .then(menu => {

    sideMenu.innerHTML = "";

    for (
      const [name, url]
      of Object.entries(menu)
    ) {

      const a =
        document.createElement("a");

      a.href = url;

      a.textContent = name;

      sideMenu.appendChild(a);

    }

  })

  .catch(err => {

    sideMenu.innerHTML =
      "<a>選單載入失敗</a>";

    console.error(err);

  });
/* =========================
   幸運刮刮樂
========================= */

const scratchItems =
  document.getElementById(
    "scratchItems"
  );

const scratchCards =
  document.getElementById(
    "scratchCards"
  );

const scratchStatus =
  document.getElementById(
    "scratchStatus"
  );
/* =========================
   預設獎項組合
========================= */

const scratchPreset = document.getElementById("scratchPreset");

function loadScratchPreset() {
  const presets = {
    family: ["錶哥熊", "綠熊", "風格熊"],
    bomb: ["🐻", "🐻", "🐻", "🐻", "💣"],
    truefalse: ["✅真(true)", "❌假(false)"],
    dice: ["1", "2", "3", "4", "5", "6"],
    food: ["🍜拉麵", "🍱便當", "🌯牛肉捲餅", "🍚大米飯", "🍙飯糰", "🍝義大利麵", "🍛印度咖哩"],
    drink: ["💧白開水", "🧃鋁箔果汁", "🍼牛奶", "🧋珍珠奶茶", "🍵茶水", "☕咖啡", "🍺酒"]
  };

  if (scratchPreset.value === "custom") {
    scratchItems.value = "";
    scratchStatus.textContent = "已切換到自訂獎項，請自行輸入內容。";
    return;
  }

  scratchItems.value = presets[scratchPreset.value].join("\n");
  startScratch();
}
scratchItems.addEventListener("input", () => {
  scratchPreset.value = "custom";
});

/* =========================
   隨機打亂
========================= */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

  return array;
}
/* =========================
   HTML 安全處理
========================= */

function escapeHTML(text) {

  return text.replace(
    /[&<>"']/g,
    char => {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

      }[char];

    }
  );

}
/* =========================
   建立刮刮卡
========================= */

function createScratchCard(
  text,
  number
) {

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "scratch-card";
  card.innerHTML = `

    <div class="scratch-number">
      第 ${number} 張
    </div>

    <div class="scratch-result">
      ${escapeHTML(text)}
    </div>

    <div class="scratch-cover">
      <canvas></canvas>
    </div>

  `;
  const canvas =
    card.querySelector(
      "canvas"
    );

  const cover =
    card.querySelector(
      ".scratch-cover"
    );
  const ctx =
    canvas.getContext(
      "2d"
    );
  let drawing = false;

  let revealed = false;
  /* =========================
     設定畫布
  ========================= */

  function resizeCanvas() {

    const rect =
      cover.getBoundingClientRect();
    const scale =
      window.devicePixelRatio || 1;
    canvas.width =
      Math.max(
        1,
        Math.floor(
          rect.width * scale
        )
      );
    canvas.height =
      Math.max(
        1,
        Math.floor(
          rect.height * scale
        )
      );
    canvas.style.width =
      rect.width + "px";

    canvas.style.height =
      rect.height + "px";
    ctx.setTransform(
      scale,
      0,
      0,
      scale,
      0,
      0
    );
    /* 刮刮卡灰色塗層 */

    ctx.globalCompositeOperation =
      "source-over";

    ctx.fillStyle =
      "#aeb5b0";

    ctx.fillRect(
      0,
      0,
      rect.width,
      rect.height
    );
    /* 中間文字 */

    ctx.fillStyle =
      "#ffffff";

    ctx.font =
      "bold 24px system-ui";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      "熊~刮我",
      rect.width / 2,
      rect.height / 2
    );
    /* 開始使用橡皮擦模式 */

    ctx.globalCompositeOperation =
      "destination-out";

    /* 筆刷大小 */

    ctx.lineWidth = 40;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

  }
  requestAnimationFrame(
    resizeCanvas
  );
  /* =========================
     取得觸控／滑鼠座標
  ========================= */

  function getPosition(event) {

    const rect =
      canvas.getBoundingClientRect();
    return [

      event.clientX -
        rect.left,

      event.clientY -
        rect.top

    ];

  }
  /* =========================
     開始刮
  ========================= */

  function startScratch(event) {

    if (revealed)
      return;
    event.preventDefault();
    drawing = true;
    /*
     * 鎖定目前的觸控／滑鼠
     */

    try {

      canvas.setPointerCapture(
        event.pointerId
      );

    } catch (e) {}
    const [x, y] =
      getPosition(event);
    ctx.beginPath();

    ctx.moveTo(
      x,
      y
    );
    /*
     * 點一下也會留下刮痕
     */

    ctx.lineTo(
      x + 0.1,
      y + 0.1
    );

    ctx.stroke();

  }
  /* =========================
     持續刮
  ========================= */

  function scratch(event) {

    if (
      !drawing ||
      revealed
    )
      return;
    event.preventDefault();
    const [x, y] =
      getPosition(event);
    ctx.lineTo(
      x,
      y
    );
    ctx.stroke();

  }
  /* =========================
     結束刮
  ========================= */

  function stopScratch(event) {

    drawing = false;

    ctx.beginPath();
    if (
      event &&
      canvas.hasPointerCapture &&
      canvas.hasPointerCapture(
        event.pointerId
      )
    ) {

      try {

        canvas.releasePointerCapture(
          event.pointerId
        );

      } catch (e) {}

    }

  }
  /* =========================
     Pointer Events
     支援：

     Android
     iPhone / iPad
     Windows
     滑鼠
     觸控筆
  ========================= */

  canvas.addEventListener(
    "pointerdown",
    startScratch
  );
  canvas.addEventListener(
    "pointermove",
    scratch
  );
  canvas.addEventListener(
    "pointerup",
    stopScratch
  );
  canvas.addEventListener(
    "pointercancel",
    stopScratch
  );
  /*
   * 如果瀏覽器失去焦點，
   * 確保不會卡在 drawing 狀態
   */

  window.addEventListener(
    "blur",
    () => {

      drawing = false;

    }
  );
  return card;

}
/* =========================
   開始遊戲
========================= */

function startScratch() {

  let items =
    scratchItems.value

      .split(/\n+/)

      .map(
        item =>
          item.trim()
      )

      .filter(Boolean);
  if (
    items.length === 0
  ) {

    scratchStatus.textContent =
      "請至少輸入一個獎項！";

    return;

  }
  /* 隨機打亂 */

  shuffle(items);
  /* 清除舊刮刮卡 */

  scratchCards.innerHTML =
    "";
  /* 建立新卡片 */

  items.forEach(
    (item, index) => {

      const card =
        createScratchCard(
          item,
          index + 1
        );
      scratchCards.appendChild(
        card
      );

    }
  );
  scratchStatus.textContent =
    `已隨機打亂 ${items.length} 張刮刮卡！`;

}
/* =========================
   清空
========================= */

function clearScratch() {

  scratchItems.value =
    "";

  scratchCards.innerHTML =
    "";

  scratchStatus.textContent =
    "";

}
/* =========================
   全部揭曉
========================= */

function revealAllScratch() {

  document
    .querySelectorAll(
      ".scratch-card"
    )
    .forEach(card => {

      card.classList.add(
        "revealed"
      );

    });
  scratchStatus.textContent =
    "全部揭曉完成！";

}
/* =========================
   網頁載入時自動開始
========================= */

startScratch();

</script>

</body>
</html></html>
