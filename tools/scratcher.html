<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="錶哥熊工具-刮刮樂">
  <title>刮刮樂|biaogeNet</title>
  <link rel="icon" href="https://biaogenet.qzz.io/images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://biaogenet.qzz.io/styles/green.css">

  <style>
    /* =========================
       刮刮樂專用樣式，不修改 green.css
    ========================= */

    .scratch-settings {
      padding: 15px;
      margin-bottom: 20px;
    }

    .scratch-settings textarea {
      width: 100%;
      min-height: 140px;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
      resize: vertical;
    }

    .scratch-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .scratch-buttons button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .scratch-start {
      background: #22b14c;
      color: white;
    }

    .scratch-clear {
      background: #ddd;
      color: #333;
    }

    .scratch-hint {
      font-size: 14px;
      opacity: 0.7;
    }

    #scratchStatus {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
      min-height: 24px;
    }

    #scratchCards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      margin-top: 20px;
      padding: 0 20px 20px;
      box-sizing: border-box;
    }

    .scratch-card {
      position: relative;
      height: 190px;
      border-radius: 18px;
      overflow: hidden;
      background: white;

    }

    .scratch-result {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      font-size: 23px;
      font-weight: bold;
      background-color: #c0e0b8;
    }

    .scratch-cover {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: crosshair;

    }

    .scratch-cover canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scratch-number {
      position: absolute;
      top: 9px;
      left: 10px;
      background: rgba(255,255,255,0.75);
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
    }

    .scratch-card.revealed .scratch-cover {
      display: none;
    }    /* =========================
       選單永遠在最上層
    ========================= */

    #sideMenu {
      position: fixed;
      z-index: 99999 !important;
    }

    /*
      內容區保持在選單下面。
      即使刮刮卡有 position/z-index，
      也不會蓋過側邊選單。
    */
    .content {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="menu-btn" onclick="OpenMenu()">☰</div>

  <img class="topimg"
       src="https://biaogenet.qzz.io/images/favicon.png"
       alt="錶哥網小圖示"/>

  <h3 class="title">錶哥網|biaogeNet</h3>
</div><!-- =========================
     側邊選單
========================= -->

<div id="sideMenu" class="side-menu">
  <a href="https://biaogenet.qzz.io">錶哥網首頁</a>
  <a href="https://biaogenet.qzz.io/imagedow.html">素材下載</a>
  <a href="https://biaogenet.qzz.io/appstore.html">應用程式商店</a>
  <a href="https://biaogenet.qzz.io/coin.html">投硬幣</a>
  <a href="https://biaogenet.qzz.io/pp.html">隱私權政策</a>
</div><!-- =========================
     網頁內容
========================= -->

<div class="content">

  <h1>幸運刮刮樂</h1>

  <div>

    <h3>自訂獎項</h3>

    <p>
      每行輸入一個獎項，開始遊戲後會自動隨機打亂順序。
    </p>

    <textarea id="scratchItems">錶哥熊
綠熊
風格熊</textarea>

    <div>
      <button onclick="startScratch()">打亂</button>
      <button onclick="clearScratch()">清空</button>
    </div>

  </div>

  <div id="scratchStatus"></div>

  <div id="scratchCards"></div>

</div><script>

/* =========================
   biaogeNet 選單
========================= */

const sideMenu =
  document.getElementById("sideMenu");function OpenMenu() {

  sideMenu.classList.toggle("open");

}/* =========================
   從 menu.json 載入選單
========================= */

fetch("https://biaogenet.qzz.io/menu.json")

  .then(r => r.json())

  .then(menu => {

    sideMenu.innerHTML = "";

    for (const [name, url] of Object.entries(menu)) {

      const a =
        document.createElement("a");

      a.href = url;

      a.textContent = name;

      sideMenu.appendChild(a);

    }

  })

  .catch(err => {

    sideMenu.innerHTML =
      "<a>選單載入失敗</a>";

    console.error(err);

  });/* =========================
   幸運刮刮樂
========================= */

const scratchItems =
  document.getElementById("scratchItems");

const scratchCards =
  document.getElementById("scratchCards");

const scratchStatus =
  document.getElementById("scratchStatus");/* =========================
   隨機打亂
========================= */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

  return array;

}/* =========================
   HTML 安全處理
========================= */

function escapeHTML(text) {

  return text.replace(
    /[&<>"']/g,
    char => {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

      }[char];

    }
  );

}/* =========================
   建立刮刮卡
========================= */

function createScratchCard(text, number) {

  const card =
    document.createElement("div");

  card.className =
    "scratch-card";  card.innerHTML = `

    <div class="scratch-number">
      第 ${number} 張
    </div>

    <div class="scratch-result">
      ${escapeHTML(text)}
    </div>

    <div class="scratch-cover">
      <canvas></canvas>
    </div>

  `;  const canvas =
    card.querySelector("canvas");

  const cover =
    card.querySelector(".scratch-cover");

  const ctx =
    canvas.getContext("2d");  let drawing = false;

  let scratchCount = 0;

  let revealed = false;  /* =========================
     設定畫布
  ========================= */

  function resizeCanvas() {

    const rect =
      canvas.getBoundingClientRect();

    const scale =
      window.devicePixelRatio || 1;    canvas.width =
      rect.width * scale;

    canvas.height =
      rect.height * scale;    ctx.setTransform(
      scale,
      0,
      0,
      scale,
      0,
      0
    );    ctx.globalCompositeOperation =
      "source-over";    ctx.fillStyle =
      "#aeb5b0";    ctx.fillRect(
      0,
      0,
      rect.width,
      rect.height
    );    ctx.fillStyle =
      "#ffffff";    ctx.font =
      "bold 24px system-ui";    ctx.textAlign =
      "center";    ctx.textBaseline =
      "middle";    ctx.fillText(
      "熊~刮我",
      rect.width / 2,
      rect.height / 2
    );    ctx.globalCompositeOperation =
      "destination-out";

  }  requestAnimationFrame(
    resizeCanvas
  );  /* =========================
     取得滑鼠／觸控座標
  ========================= */

  function getPosition(event) {

    const rect =
      canvas.getBoundingClientRect();    const point =
      event.touches
        ? event.touches[0]
        : event;    return [

      point.clientX -
        rect.left,

      point.clientY -
        rect.top

    ];

  }  /* =========================
     刮
  ========================= */

  function scratch(event) {

    if (revealed)
      return;    event.preventDefault();    const [x, y] =
      getPosition(event);    if (!drawing) {
      ctx.beginPath();
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
      ctx.stroke();
    }    ctx.lineWidth =
      32;    ctx.lineCap =
      "round";    ctx.lineJoin =
      "round";    scratchCount++;    /* =========================
       自動揭曉
    ========================= */

    if (scratchCount >= 99999) {
      card.classList.add(
        "revealed"
      );      scratchStatus.textContent =
        "刮開完成！";

    }

  }  function stopScratch() {

    drawing = false;

    ctx.beginPath();

  }  /* =========================
     電腦滑鼠
  ========================= */

  canvas.addEventListener(
    "mousedown",
    event => {
      // 電腦版：只有按下左鍵才開始刮
      if (event.button !== 0) return;
      drawing = true;
      scratch(event);
    }
  );

  canvas.addEventListener(
    "mousemove",
    event => {
      // 電腦版：必須持續按住左鍵才算刮
      if (!drawing || (event.buttons & 1) !== 1) {
        stopScratch();
        return;
      }
      scratch(event);
    }
  );

  window.addEventListener(
    "mouseup",
    stopScratch
  );  /* =========================
     手機觸控
  ========================= */

  canvas.addEventListener(
    "touchstart",
    scratch,
    { passive: false }
  );

  canvas.addEventListener(
    "touchmove",
    scratch,
    { passive: false }
  );

  canvas.addEventListener(
    "touchend",
    stopScratch
  );  return card;

}/* =========================
   開始遊戲
========================= */

function startScratch() {

  let items =
    scratchItems.value

      .split(/\n+/)

      .map(
        item => item.trim()
      )

      .filter(Boolean);  if (items.length === 0) {

    scratchStatus.textContent =
      "請至少輸入一個獎項！";

    return;

  }  /* 隨機打亂 */

  shuffle(items);  /* 清除舊刮刮卡 */

  scratchCards.innerHTML =
    "";  /* 建立新卡片 */

  items.forEach(
    (item, index) => {

      const card =
        createScratchCard(
          item,
          index + 1
        );      scratchCards.appendChild(
        card
      );

    }
  );  scratchStatus.textContent =
    `已隨機打亂 ${items.length} 張刮刮卡！`;

}/* =========================
   清空
========================= */

function clearScratch() {

  scratchItems.value =
    "";

  scratchCards.innerHTML =
    "";

  scratchStatus.textContent =
    "";

}/* =========================
   網頁載入時自動開始
========================= */

startScratch();

</script>

</body>
</html>
